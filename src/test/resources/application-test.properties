spring.application.name=SmartTaskManager-Test

# Use In-Memory H2 for automated fast testing
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Disable Flyway for fast unit/slice testing
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Dummy Mail Configuration for Test
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test
spring.mail.password=test

# Application Properties for Test
app.mail.from=test@smarttaskmanager.com
app.mail.from-name=Smart Task Manager Test
app.public-base-url=http://localhost:8080
app.frontend-base-url=http://localhost:3000

app.jwt.secret=4c696e676572696e675f73757065725f7365637265745f6b65795f666f725f736d6172745f7461736b5f6d616e616765725f3230323621
app.jwt.access-token-expiration-ms=900000
app.jwt.refresh-token-expiration-ms=604800000
app.jwt.verification-token-expiration-ms=86400000
app.jwt.password-reset-token-expiration-ms=3600000

# Reminder Scheduler Configuration for Tests
app.reminder.scheduler-interval-ms=300000
app.reminder.initial-delay-ms=5000
app.reminder.max-batch-size=50
app.reminder.max-retries=3

# CORS Configuration for Tests
app.cors.origins=http://localhost:3000,http://localhost:8080

# Actuator Health
management.health.mail.enabled=false
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Request Size Limits for Tests
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB

# AI Task Capture Configuration for Tests
app.ai.provider=rulebased
app.ai.model=gpt-4o-mini
