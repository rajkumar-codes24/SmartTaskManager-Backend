# Concurrency test profile - uses H2 file-based DB with Flyway for real concurrent access
spring.application.name=SmartTaskManager-ConcurrencyTest

# H2 file-based database for concurrent connections (not in-memory)
spring.datasource.url=jdbc:h2:file:./target/testdb-concurrency;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Enable Flyway for real schema
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Dummy Mail Configuration
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test
spring.mail.password=test

# Application Properties
app.mail.from=test@smarttaskmanager.com
app.mail.from-name=Smart Task Manager Test
app.public-base-url=http://localhost:8080

app.jwt.secret=4c696e676572696e675f73757065725f7365637265745f6b65795f666f725f736d6172745f7461736b5f6d616e616765725f3230323621
app.jwt.access-token-expiration-ms=900000
app.jwt.refresh-token-expiration-ms=604800000
app.jwt.verification-token-expiration-ms=86400000
app.jwt.password-reset-token-expiration-ms=3600000

# Reminder Scheduler - disabled for concurrency tests
app.reminder.scheduler-interval-ms=300000
app.reminder.initial-delay-ms=5000
app.reminder.max-batch-size=50
app.reminder.max-retries=3

# CORS Configuration
app.cors.origins=http://localhost:3000,http://localhost:8080

# Actuator Health
management.health.mail.enabled=false
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Request Size Limits
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB
