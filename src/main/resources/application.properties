spring.application.name=SmartTaskManager

# Server Configuration
server.port=9999

# Database Configuration (Supplied via environment variables)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_task_manager?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# Flyway Database Migrations
# Executes all pending versioned migrations in classpath:db/migration automatically on application startup
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Hibernate & JPA Configuration
# Hibernate validates the schema produced by Flyway migrations without attempting destructive modifications
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# SMTP Mail Configuration
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=30000
spring.mail.properties.mail.smtp.timeout=30000
spring.mail.properties.mail.smtp.writetimeout=30000

# Application Specific Configuration
app.mail.from=${MAIL_FROM:smarttaskmanager.notifications@gmail.com}
app.mail.from-name=${MAIL_FROM_NAME:Smart Task Manager}
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:9999}
# Frontend base URL for email links (password reset, etc.)
app.frontend-base-url=${APP_FRONTEND_BASE_URL:http://localhost:3000}

# JWT Configuration
# MUST be supplied via JWT_SECRET environment variable (e.g., generate with: openssl rand -hex 64)
# No default secret is hardcoded to prevent insecure deployments.
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
app.jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
app.jwt.verification-token-expiration-ms=${JWT_VERIFICATION_EXPIRATION_MS:86400000}
app.jwt.password-reset-token-expiration-ms=${JWT_RESET_EXPIRATION_MS:3600000}

# Reminder Scheduler Configuration
# The scheduler runs every 30 seconds by default for timely reminder delivery
app.reminder.scheduler-interval-ms=${REMINDER_SCHEDULER_INTERVAL_MS:30000}
app.reminder.initial-delay-ms=${REMINDER_INITIAL_DELAY_MS:5000}
app.reminder.max-batch-size=${REMINDER_MAX_BATCH_SIZE:50}
app.reminder.max-retries=${REMINDER_MAX_RETRIES:3}

# CORS Configuration for React Frontend
# Comma-separated list of allowed origins
app.cors.origins=${APP_CORS_ORIGINS:http://localhost:3000,http://localhost:8080}

# Actuator Health
# Mail indicator is disabled so external SMTP connectivity does not cause false negative health checks
management.health.mail.enabled=false
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Security Headers
server.headers.cache-control=no-cache
server.headers.x-content-type-options=nosniff
server.headers.x-frame-options=SAMEORIGIN

# Request Size Limits
# Prevents large payload attacks by limiting request body size
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB
server.tomcat.max-swallow-size=1MB

# AI Task Capture Configuration
# Provider: "openai" or "rulebased" (default: rulebased)
app.ai.provider=${AI_PROVIDER:rulebased}
# OpenAI model to use (default: gpt-4o-mini)
app.ai.model=${OPENAI_MODEL:gpt-4o-mini}
